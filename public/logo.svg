<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hard Neo-Brutalist Drop Shadow -->
    <filter id="neo-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Node Connection Branch Lines -->
  <path d="M 110 390 L 110 340 L 256 340 L 256 295" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 402 390 L 402 340 L 256 340" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 1. Centered Landscape Certificate Document (Top / Center) -->
  <g filter="url(#neo-shadow)">
    <!-- Main White Certificate Card -->
    <rect x="56" y="45" width="400" height="255" rx="28" fill="#FFFFFF" stroke="#000000" stroke-width="14" />
    
    <!-- Gold Ornate Frame -->
    <rect x="74" y="63" width="364" height="219" rx="18" fill="none" stroke="#FACC15" stroke-width="6" stroke-dasharray="12 6" />
    
    <!-- Navy Header Bar -->
    <rect x="156" y="88" width="200" height="22" rx="7" fill="#0F2C59" />

    <!-- Center Gold Award Seal with Pink Ribbon Tails -->
    <path d="M 256 185 L 232 238 L 256 226 L 280 238 Z" fill="#EC4899" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <circle cx="256" cy="162" r="32" fill="#A3E635" stroke="#000000" stroke-width="7" />
    <polygon points="256,144 262,157 276,158 266,168 268,181 256,175 244,181 246,168 236,158 250,157" fill="#FACC15" stroke="#000000" stroke-width="3.5" />

    <!-- Recipient Calligraphy Line & Gold Underline -->
    <path d="M 110 208 Q 256 180 402 208" fill="none" stroke="#B8860B" stroke-width="5" stroke-linecap="round" />
    <line x1="120" y1="222" x2="392" y2="222" stroke="#D4AF37" stroke-width="4" />

    <!-- Signature Lines -->
    <line x1="110" y1="258" x2="180" y2="258" stroke="#000000" stroke-width="4" />
    <line x1="332" y1="258" x2="402" y2="258" stroke="#000000" stroke-width="4" />
  </g>

  <!-- 2. Symmetrical Flow Nodes (Bottom Row) -->
  <!-- Left Node: Data Input (Cyan) -->
  <g filter="url(#neo-shadow)">
    <rect x="45" y="375" width="130" height="76" rx="22" fill="#22D3EE" stroke="#000000" stroke-width="10" />
    <circle cx="110" cy="413" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <circle cx="110" cy="413" r="6" fill="#000000" />
  </g>

  <!-- Center Node: Logic Flow Node (Purple) -->
  <g filter="url(#neo-shadow)">
    <rect x="191" y="375" width="130" height="76" rx="22" fill="#C084FC" stroke="#000000" stroke-width="10" />
    <path d="M 234 413 L 278 413 M 264 399 L 280 413 L 264 427" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Node: Output Export (Lime) -->
  <g filter="url(#neo-shadow)">
    <rect x="337" y="375" width="130" height="76" rx="22" fill="#A3E635" stroke="#000000" stroke-width="10" />
    <polyline points="388,401 402,413 388,425" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
